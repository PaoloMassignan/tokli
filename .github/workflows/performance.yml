name: performance

# Weekly regression check of the E9 benchmark against the committed baseline
# (TOKLI_TEST_STRATEGY §8: warn above 1.25x, fail above 2x; never an absolute millisecond gate).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e9:
    name: E9 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tokli-data/tokenizers
          key: tokenizers-${{ runner.os }}-o200k-446a9538cb6c-cl100k-223921b76ee9
      - run: tokli setup tokenizers --data-dir "${{ runner.temp }}/tokli-data"
      - run: python -m benchmarks.overhead --data-dir "${{ runner.temp }}/tokli-data" --iterations 30 --out current.json
      - name: Compare with baseline
        run: python -m benchmarks.compare current.json "benchmarks/baseline/e9-${{ runner.os }}.json"
