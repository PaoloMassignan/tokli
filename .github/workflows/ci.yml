name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Import contracts (TOKLI_ARCHITECTURE.md §5, ADR 0004)
        run: lint-imports

      - name: Cache tokenizer files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tokli-data/tokenizers
          key: tokenizers-${{ runner.os }}-o200k-446a9538cb6c-cl100k-223921b76ee9

      - name: Provision tokenizers (the only networked Tokli command, PT-003)
        run: >
          tokli setup tokenizers --data-dir "${{ runner.temp }}/tokli-data"
          --set 'tokens.model_map=[{"pattern": "x-*", "tokenizer": "cl100k_base"}]'

      - name: Tests
        env:
          TEST_TOKLI_PROVISIONED_DATA_DIR: ${{ runner.temp }}/tokli-data
          RUN_PACKAGING_TESTS: "1"
        run: python -m pytest

      - name: Browser tests of the dashboard (AC-UI-2; one job, ADR 0006)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          RUN_BROWSER_TESTS: "1"
        run: |
          python -m pip install -e ".[ui-test]"
          python -m playwright install --with-deps chromium
          python -m pytest tests/ui

      - name: Metrics query benchmark (reported, not gated)
        if: matrix.python == '3.13'
        run: python -m benchmarks.metrics --rows 100000 --out metrics-${{ runner.os }}.json

      - name: Normalized doctor snapshot (AC-PT-7)
        run: |
          tokli doctor --normalized --data-dir "${{ runner.temp }}/tokli-data" | tr -d '\r' > doctor-normalized.txt
          cat doctor-normalized.txt

      - name: Rendered corpus hashes (S1 acceptance 5)
        run: |
          python -m tests.compat.render_corpus --data-dir "${{ runner.temp }}/tokli-data" | tr -d '\r' > corpus-hashes.txt
          cat corpus-hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.os }}-${{ matrix.python }}
          path: |
            doctor-normalized.txt
            corpus-hashes.txt

      - name: E9 overhead benchmark (reported, not gated)
        if: matrix.python == '3.13'
        run: python -m benchmarks.overhead --data-dir "${{ runner.temp }}/tokli-data" --iterations 30 --out e9-${{ runner.os }}.json

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: e9-${{ runner.os }}
          path: |
            e9-${{ runner.os }}.json
            metrics-${{ runner.os }}.json

  identical-across-jobs:
    name: Doctor snapshot and rendered corpus identical in all 9 jobs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: identity-*
          path: snapshots
      - name: Compare
        run: |
          set -euo pipefail
          count=$(ls -d snapshots/*/ | wc -l)
          test "$count" -eq 9 || { echo "expected 9 snapshots, got $count"; exit 1; }
          first=$(ls -d snapshots/*/ | head -1)
          for dir in snapshots/*/; do
            diff -u "$first/doctor-normalized.txt" "$dir/doctor-normalized.txt"
            diff -u "$first/corpus-hashes.txt" "$dir/corpus-hashes.txt"
          done
          echo "doctor snapshots and rendered corpus hashes are identical in all 9 jobs"
