    input_schema:
      type: object
      properties:
        file_path:
          type: string
        content:
          type: string
      required:
      - file_path
      - content
  - name: Edit
    description: Replaces old_string with new_string in a file.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
        old_string:
          type: string
        new_string:
          type: string
      required:
      - file_path
      - old_string
      - new_string
  - name: Read
    description: Reads a file and returns its content.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
      required:
      - file_path
